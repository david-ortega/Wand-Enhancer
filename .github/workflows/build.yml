name: Build and Release

on:
  push:
    branches:
      - main # Triggers automatically when the sync action pushes upstream changes to your fork
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create the release and upload assets

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build unsigned executable
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Create Release and Upload Executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "WandEnhancer Release ${{ github.run_number }}"
          files: |
            WandEnhancer/bin/Release/WandEnhancer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
